# Kars Hotel PMS — боевой контур на СВОЁМ VPS.
#
# Отдельный сервер от Kars Avia: системы разные, и общая машина означала бы,
# что падение одной уносит другую. Связь между ними — только по HTTP, ключом
# партнёрского API.
#
# Первый запуск:
#   cp .env.example .env   # задать пароли, домен, ключ партнёра
#   docker compose up -d --build
#   docker compose exec api pnpm exec prisma migrate deploy
#
# Порты 80/443 наружу открывает только Caddy. База, Redis и MinIO во внешний
# мир не смотрят вовсе — им незачем.

# Журналы контейнеров — с ротацией (152-ФЗ, Р-13; план 12.3). Без неё
# json-file Docker растёт без предела и хранит всё, что сервис напечатал,
# сколько угодно долго. 5 × 20 МБ на сервис.
x-logging: &logging
  driver: json-file
  options:
    max-size: 20m
    max-file: '5'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?нужен пароль базы}
      POSTGRES_DB: ${POSTGRES_DB:-kars_hotel}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    logging: *logging
    volumes:
      - redisdata:/data

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    logging: *logging
    environment:
      NODE_ENV: production
      PORT: 3001
      # ДВА подключения — это граница изоляции гостиниц, а не украшение.
      # Рантайм ходит под app_user БЕЗ BYPASSRLS: фильтр по гостинице держит
      # Row-Level Security, запросы по tenant не фильтруют сами. Суперпользователь
      # в DATABASE_URL обходит RLS молча — каждая гостиница видит чужие строки
      # (поймано на первом развёртывании 03.09.2026: у всех гостиниц оказались
      # все номера системы). Суперпользователь остаётся только миграциям.
      DATABASE_URL: postgresql://app_user:${APP_DB_PASSWORD:?нужен пароль app_user}@postgres:5432/${POSTGRES_DB:-kars_hotel}
      DATABASE_URL_MIGRATIONS: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-kars_hotel}
      REDIS_URL: redis://redis:6379
      # Код читает пару секретов (access/refresh), а не единый JWT_SECRET —
      # это выяснил первый реальный запуск образа.
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?нужен секрет access-токенов}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?нужен секрет refresh-токенов}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      # Схема адреса решает судьбу Secure-флага refresh-куки: http:// — режим
      # без TLS (кука обычная), голый домен — боевой HTTPS (кука защищённая).
      PUBLIC_URL: ${PMS_DOMAIN:-}
      # Вебхуки партнёру (Kars Avia): куда слать события и общий секрет
      # X-Webhook-Secret. Пусто — вебхуки выключены, это штатно.
      PARTNER_WEBHOOK_URL: ${PARTNER_WEBHOOK_URL:-}
      PARTNER_WEBHOOK_SECRET: ${PARTNER_WEBHOOK_SECRET:-}
      # На бою адреса наружу — только https: с http:// в PUBLIC_URL (PMS_DOMAIN)
      # или адресах партнёра API не стартует (152-ФЗ, план 12.1). Временный
      # режим без доменов — ALLOW_INSECURE_HTTP=yes, осознанно.
      ALLOW_INSECURE_HTTP: ${ALLOW_INSECURE_HTTP:-}
      # Оферта с поручением (план 13.11): версия (0 — не опубликована) и адрес текста.
      PMS_OFFER_VERSION: ${PMS_OFFER_VERSION:-0}
      PMS_OFFER_URL: ${PMS_OFFER_URL:-}
      # Сроки хранения ПДн (план 13.9): off (по умолчанию) / dry — только счёт / on.
      PMS_RETENTION_MODE: ${PMS_RETENTION_MODE:-off}
      # Хранилище фото (21.10.2026): до этого в бою его не было вовсе —
      # «Storage init failed», фото гостиниц не загружались. S3_PUBLIC_URL —
      # адрес, которым картинку видит браузер (Caddy ведёт /kars-hotel/* в
      # MinIO; у Авии на https тот же путь проксируется сюда).
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-kars-hotel}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?нужен пароль MinIO}
      S3_BUCKET: ${S3_BUCKET:-kars-hotel}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started

  # Хранилище фото. Версия закреплена: каталог данных переносится с ноутбука
  # как есть, а формат MinIO между выпусками менялся.
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    logging: *logging
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-kars-hotel}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?нужен пароль MinIO}
    volumes:
      - minio_data:/data

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Относительный адрес: кабинет и API на одном домене, и смена домена
        # не требует пересборки.
        VITE_API_BASE_URL: /api
        # Адрес политики обработки ПДн (план 13.11); пусто — app.karsavia.ru/privacy.
        VITE_PRIVACY_URL: ${PRIVACY_URL:-}
    restart: unless-stopped
    logging: *logging
    depends_on:
      - api

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *logging
    ports:
      - '80:80'
      - '443:443'
    environment:
      ACME_EMAIL: ${ACME_EMAIL:-admin@karsavia.ru}
      PMS_DOMAIN: ${PMS_DOMAIN:-pms.karsavia.ru}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
    depends_on:
      - api
      - web

  # Суточные резервные копии базы. Своим сервисом, а не задачей в системном
  # cron: контур переезжает на новый VPS целиком одним `docker compose up`, и
  # копирование должно переезжать вместе с ним, а не оставаться настройкой
  # машины, о которой вспомнят после первой потери.
  backup:
    # postgres той же версии + age и rclone (backup/Dockerfile, план 12.4).
    build: ./backup
    image: kars-hotel-backup
    restart: unless-stopped
    logging: *logging
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-kars_hotel}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_AT_HOUR: ${BACKUP_AT_HOUR:-3}
      # Внешняя шифрованная копия (план 12.4, подробно — backup/run.sh):
      # открытый ключ age, rclone-адрес и ключ хранилища ТОЛЬКО НА ЗАПИСЬ.
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}
      BACKUP_REMOTE: ${BACKUP_REMOTE:-}
      RCLONE_CONFIG_OFFSITE_TYPE: s3
      RCLONE_CONFIG_OFFSITE_PROVIDER: ${BACKUP_S3_PROVIDER:-Other}
      RCLONE_CONFIG_OFFSITE_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      RCLONE_CONFIG_OFFSITE_REGION: ${BACKUP_S3_REGION:-ru-central1}
      RCLONE_CONFIG_OFFSITE_ACCESS_KEY_ID: ${BACKUP_S3_KEY_ID:-}
      RCLONE_CONFIG_OFFSITE_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET:-}
      # Тревога о пропущенной копии — «пульс» во внешний монитор.
      BACKUP_PING_URL: ${BACKUP_PING_URL:-}
    volumes:
      - ./backup:/backup:ro
      - backups:/backups
    entrypoint: ['/bin/sh', '/backup/run.sh']
    depends_on:
      postgres:
        condition: service_healthy

  # Восстановление — своей службой (152-ФЗ, Р-52; план 12.5). Не стартует с
  # `up` (профиль restore), запускается руками:
  #   docker compose run --rm restore                          # список копий
  #   docker compose run --rm -e CONFIRM=yes restore <дамп>
  # Заводит app_user без обхода RLS и проверяет изоляцию гостиниц.
  restore:
    build: ./backup
    image: kars-hotel-backup
    profiles: [restore]
    logging: *logging
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-kars_hotel}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?нужен пароль app_user}
      # Из внешней копии: ключ хранилища НА ЧТЕНИЕ и закрытый ключ age
      # приносят при восстановлении (-e, -v), на сервере их нет.
      BACKUP_REMOTE: ${BACKUP_REMOTE:-}
      RCLONE_CONFIG_OFFSITE_TYPE: s3
      RCLONE_CONFIG_OFFSITE_PROVIDER: ${BACKUP_S3_PROVIDER:-Other}
      RCLONE_CONFIG_OFFSITE_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      RCLONE_CONFIG_OFFSITE_REGION: ${BACKUP_S3_REGION:-ru-central1}
    volumes:
      - ./backup:/backup:ro
      - backups:/backups:ro
    entrypoint: ['/bin/sh', '/backup/restore.sh']
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  minio_data:
  caddy_data:
  caddy_config:
  caddy_logs:
  backups:
