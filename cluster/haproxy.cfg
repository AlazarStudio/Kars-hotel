# «Диспетчер» базы PMS на vk-hotel: сервис postgres в compose, приложение и
# backup ходят на postgres:5432 как раньше, а HAProxy ведёт их к текущему
# лидеру Patroni (проверка — REST /primary на 8018).
global
    maxconn 300

defaults
    mode tcp
    timeout connect 3s
    timeout client  8h
    timeout server  8h
    option clitcpka
    option srvtcpka
    timeout check   2s

listen postgres
    bind :5432
    option httpchk GET /primary
    http-check expect status 200
    default-server inter 2s fall 2 rise 2 on-marked-down shutdown-sessions
    server pms-vk    10.77.0.4:5442 check port 8018
    server pms-tw    10.77.0.5:5442 check port 8018
    server pms-local 10.77.0.3:5442 check port 8018

listen stats
    bind 127.0.0.1:8404
    mode http
    stats enable
    stats uri /
